  <circle cx="70" cy="22" r="7" fill="#27c93f"/>
  <text x="40" y="100" font-family="monospace" font-size="26" fill="#39ff14">&gt; cat code.py</text>
  <text x="40" y="150" font-family="monospace" font-size="22" fill="#7ee787">def solve(x):</text>
  <text x="70" y="185" font-family="monospace" font-size="22" fill="#9da7b3">return x * 42</text>
  <text x="40" y="235" font-family="monospace" font-size="22" fill="#7ee787">if __name__ == '__main__':</text>
  <text x="70" y="270" font-family="monospace" font-size="22" fill="#9da7b3">print(solve(1))</text>
