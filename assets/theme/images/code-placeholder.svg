<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0a0e14"/>
  <rect x="0" y="0" width="800" height="44" fill="#11161f"/>
